name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Types, tests and the build, on the oldest Node mcpspy supports (package.json "engines",
  # the first release with node:sqlite unflagged) and the current LTS.
  ci:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The packaged CLI starts, and proxies a real stdio server end to end.
      - name: Smoke Test
        run: |
          node dist/cli.js --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | node dist/cli.js run --db smoke.db --name smoke -- node test/fixtures/echo-server.mjs
          node dist/cli.js tail --db smoke.db | tee tail.txt
          grep -q 'initialize ✓' tail.txt
